[project]
name = "jb-api"
version = "0.1.0"
description = "JB exchange API (HackCMU 2026)"
# Upper bound because sentence-transformers has no wheels for 3.13+ yet, and
# the system python on at least one of our machines is 3.14.
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "motor",
  "openai",
  "httpx",
  "querit",
  "sentence-transformers",
  "sse-starlette",
  "pyyaml",
  "strawberry-graphql[fastapi]>=0.280,<1",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
