openapi: 3.1.0
info:
  title: JB API
  version: 0.1.0
paths:
  /api/v1/companies:
    post:
      tags:
      - companies
      summary: Create Company
      description: 'Create a company from observables, run the valuation ensemble, open its market.

        Role B''s discovery pipeline calls this (or engine.create_company directly) per company.'
      operationId: create_company_api_v1_companies_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - companies
      summary: List Companies
      operationId: list_companies_api_v1_companies_get
      parameters:
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: State
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: sort
        in: query
        required: false
        schema:
          type: string
          pattern: ^(v0|confidence|last|name)$
          default: v0
          title: Sort
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyCard'
                title: Response List Companies Api V1 Companies Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/companies/{cid}:
    get:
      tags:
      - companies
      summary: Get Company
      operationId: get_company_api_v1_companies__cid__get
      parameters:
      - name: cid
        in: path
        required: true
        schema:
          type: string
          title: Cid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/companies/valuation/preview:
    post:
      tags:
      - companies
      summary: Preview Valuation
      description: Run the ensemble without creating anything. Handy for the UI and for calibration.
      operationId: preview_valuation_api_v1_companies_valuation_preview_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Valuation'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/discovery/search:
    post:
      tags:
      - discovery
      summary: Search
      operationId: search_api_v1_discovery_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchIn'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchJobAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/discovery/jobs/{job_id}:
    get:
      tags:
      - discovery
      summary: Job Stream
      operationId: job_stream_api_v1_discovery_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/markets/{mid}:
    get:
      tags:
      - markets
      summary: Get Market
      operationId: get_market_api_v1_markets__mid__get
      parameters:
      - name: mid
        in: path
        required: true
        schema:
          type: string
          title: Mid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/markets/{mid}/book:
    get:
      tags:
      - markets
      summary: Get Book
      operationId: get_book_api_v1_markets__mid__book_get
      parameters:
      - name: mid
        in: path
        required: true
        schema:
          type: string
          title: Mid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/markets/{mid}/orders:
    post:
      tags:
      - markets
      summary: Place Order
      operationId: place_order_api_v1_markets__mid__orders_post
      parameters:
      - name: mid
        in: path
        required: true
        schema:
          type: string
          title: Mid
      - name: x-demo-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Demo-User
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/markets/{mid}/orders/mine:
    get:
      tags:
      - markets
      summary: My Orders
      operationId: my_orders_api_v1_markets__mid__orders_mine_get
      parameters:
      - name: mid
        in: path
        required: true
        schema:
          type: string
          title: Mid
      - name: x-demo-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Demo-User
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
                title: Response My Orders Api V1 Markets  Mid  Orders Mine Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/markets/orders/{oid}:
    delete:
      tags:
      - markets
      summary: Cancel Order
      operationId: cancel_order_api_v1_markets_orders__oid__delete
      parameters:
      - name: oid
        in: path
        required: true
        schema:
          type: string
          title: Oid
      - name: x-demo-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Demo-User
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/markets/{mid}/batches:
    get:
      tags:
      - markets
      summary: Batches
      description: 'Price history. By default only rounds that carry a price (trades or limit up/down
        steps),

        which is what the chart wants; `all=true` includes quiet rounds with clearing_price null.'
      operationId: batches_api_v1_markets__mid__batches_get
      parameters:
      - name: mid
        in: path
        required: true
        schema:
          type: string
          title: Mid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 60
          title: Limit
      - name: snapshot
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Snapshot
      - name: all
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: All
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Batch'
                title: Response Batches Api V1 Markets  Mid  Batches Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/markets/{mid}/trades:
    get:
      tags:
      - markets
      summary: Trades
      operationId: trades_api_v1_markets__mid__trades_get
      parameters:
      - name: mid
        in: path
        required: true
        schema:
          type: string
          title: Mid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trade'
                title: Response Trades Api V1 Markets  Mid  Trades Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/markets/{mid}/batch/run:
    post:
      tags:
      - markets
      summary: Run Batch Now
      description: Force a round to clear now. Demo and test convenience.
      operationId: run_batch_now_api_v1_markets__mid__batch_run_post
      parameters:
      - name: mid
        in: path
        required: true
        schema:
          type: string
          title: Mid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/portfolio:
    get:
      tags:
      - portfolio
      summary: Get Portfolio
      operationId: get_portfolio_api_v1_portfolio_get
      parameters:
      - name: x-demo-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Demo-User
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/portfolio/suggest:
    post:
      tags:
      - portfolio
      summary: Suggest
      description: 'Half Kelly over every market (or the user''s filters). value = user''s own value if
        given,

        else the model value. Role D layers vector matching and Grok narrative on top of this.'
      operationId: suggest_api_v1_portfolio_suggest_post
      parameters:
      - name: x-demo-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Demo-User
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/SuggestIn'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Suggestion'
                title: Response Suggest Api V1 Portfolio Suggest Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/acquire/{cid}/start:
    post:
      tags:
      - acquire
      summary: Start
      operationId: start_api_v1_acquire__cid__start_post
      parameters:
      - name: cid
        in: path
        required: true
        schema:
          type: string
          title: Cid
      - name: x-demo-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Demo-User
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acquisition'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/acquire/{acq_id}:
    get:
      tags:
      - acquire
      summary: Get
      operationId: get_api_v1_acquire__acq_id__get
      parameters:
      - name: acq_id
        in: path
        required: true
        schema:
          type: string
          title: Acq Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acquisition'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/surveillance/audit:
    get:
      tags:
      - surveillance
      summary: Audit
      operationId: audit_api_v1_surveillance_audit_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 200
          title: Limit
      - name: actor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/surveillance/treasury:
    get:
      tags:
      - surveillance
      summary: Treasury Summary
      operationId: treasury_summary_api_v1_surveillance_treasury_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/surveillance/flags:
    get:
      tags:
      - surveillance
      summary: Flags
      operationId: flags_api_v1_surveillance_flags_get
      parameters:
      - name: market_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Market Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Flag'
                title: Response Flags Api V1 Surveillance Flags Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/chat:
    post:
      tags:
      - agent
      summary: Chat
      operationId: chat_api_v1_agent_chat_post
      parameters:
      - name: x-demo-user
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Demo-User
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /readiness:
    get:
      summary: Readiness
      description: Which store is live and which keys are set. Useful while keys are still coming in.
      operationId: readiness_readiness_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    Acquisition:
      properties:
        acquisition_id:
          type: string
          title: Acquisition Id
        market_id:
          type: string
          title: Market Id
        loi_md:
          type: string
          title: Loi Md
        checklist:
          items:
            $ref: '#/components/schemas/ChecklistItem'
          type: array
          title: Checklist
        status:
          type: string
          enum:
          - draft
          - sent
          - closed
          title: Status
          default: draft
      type: object
      required:
      - acquisition_id
      - market_id
      - loi_md
      - checklist
      title: Acquisition
    AgentChatRequest:
      properties:
        session_id:
          type: string
          title: Session Id
        message:
          type: string
          title: Message
      type: object
      required:
      - session_id
      - message
      title: AgentChatRequest
    AgentMessage:
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
          title: Role
        content:
          type: string
          title: Content
        tool_calls:
          anyOf:
          - items:
              $ref: '#/components/schemas/ToolCallCard'
            type: array
          - type: 'null'
          title: Tool Calls
      type: object
      required:
      - role
      - content
      title: AgentMessage
    Band:
      properties:
        pct:
          type: number
          title: Pct
        low:
          anyOf:
          - type: number
          - type: 'null'
          title: Low
        high:
          anyOf:
          - type: number
          - type: 'null'
          title: High
      type: object
      required:
      - pct
      - low
      - high
      title: Band
    Batch:
      properties:
        _id:
          type: string
          title: Id
        market_id:
          type: string
          title: Market Id
        t:
          type: string
          title: T
        clearing_price:
          anyOf:
          - type: number
          - type: 'null'
          title: Clearing Price
        volume:
          type: number
          title: Volume
        imbalance:
          type: number
          title: Imbalance
        n_buy:
          type: integer
          title: N Buy
        n_sell:
          type: integer
          title: N Sell
        band_hit:
          type: boolean
          title: Band Hit
        ref_moved:
          type: boolean
          title: Ref Moved
        book_snapshot:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Book Snapshot
      type: object
      required:
      - _id
      - market_id
      - t
      - clearing_price
      - volume
      - imbalance
      - n_buy
      - n_sell
      - band_hit
      - ref_moved
      title: Batch
    Belief:
      properties:
        mu:
          type: number
          title: Mu
        sigma:
          type: number
          title: Sigma
        s_m:
          type: number
          title: S M
        n_rounds:
          type: integer
          title: N Rounds
        model_value:
          type: number
          title: Model Value
        market_value:
          type: number
          title: Market Value
      type: object
      required:
      - mu
      - sigma
      - s_m
      - n_rounds
      - model_value
      - market_value
      title: Belief
    Book:
      properties:
        market_id:
          type: string
          title: Market Id
        bids:
          items:
            $ref: '#/components/schemas/BookLevel'
          type: array
          title: Bids
        asks:
          items:
            $ref: '#/components/schemas/BookLevel'
          type: array
          title: Asks
        last:
          anyOf:
          - type: number
          - type: 'null'
          title: Last
        ref:
          anyOf:
          - type: number
          - type: 'null'
          title: Ref
        indicative_price:
          anyOf:
          - type: number
          - type: 'null'
          title: Indicative Price
        next_batch_at:
          type: string
          title: Next Batch At
        band:
          $ref: '#/components/schemas/Band'
        halted:
          type: boolean
          title: Halted
        n_open_orders:
          type: integer
          title: N Open Orders
      type: object
      required:
      - market_id
      - bids
      - asks
      - last
      - ref
      - indicative_price
      - next_batch_at
      - band
      - halted
      - n_open_orders
      title: Book
    BookLevel:
      properties:
        price:
          type: number
          title: Price
        qty:
          type: number
          title: Qty
        origin:
          type: string
          enum:
          - user
          - treasury
          - bot
          - agent
          title: Origin
      type: object
      required:
      - price
      - qty
      - origin
      title: BookLevel
    ChecklistItem:
      properties:
        item:
          type: string
          title: Item
        why:
          type: string
          title: Why
        citation:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Citation
        done:
          type: boolean
          title: Done
          default: false
      type: object
      required:
      - item
      - why
      - citation
      title: ChecklistItem
    Company:
      properties:
        _id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        category:
          type: string
          title: Category
        naics_guess:
          anyOf:
          - type: string
          - type: 'null'
          title: Naics Guess
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
        lat:
          anyOf:
          - type: number
          - type: 'null'
          title: Lat
        lng:
          anyOf:
          - type: number
          - type: 'null'
          title: Lng
        website:
          anyOf:
          - type: string
          - type: 'null'
          title: Website
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        rating:
          anyOf:
          - type: number
          - type: 'null'
          title: Rating
        review_count:
          type: integer
          title: Review Count
        founded_year:
          anyOf:
          - type: integer
