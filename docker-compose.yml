services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENV: ${ENV:-dev}
      DEMO_AUTH: ${DEMO_AUTH:-true}
      # Local mongo by default; point at Atlas by setting MONGODB_URI in .env.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-jb}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.6}
      IFM_API_KEY: ${IFM_API_KEY:-}
      IFM_BASE_URL: ${IFM_BASE_URL:-}
      IFM_MODEL: ${IFM_MODEL:-}
      QUERIT_API_KEY: ${QUERIT_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
