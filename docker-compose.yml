services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Unset MONGODB_URI to run on the in-memory store instead.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-jb}
      DEMO_AUTH: ${DEMO_AUTH:-1}
      SEED: ${SEED:-1}
      BOTS: ${BOTS:-0}
      TICK_S: ${TICK_S:-1.0}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      XAI_MODEL: ${XAI_MODEL:-grok-4.6}
      IFM_API_KEY: ${IFM_API_KEY:-}
      IFM_BASE_URL: ${IFM_BASE_URL:-}
      IFM_MODEL: ${IFM_MODEL:-}
      QUERIT_API_KEY: ${QUERIT_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
